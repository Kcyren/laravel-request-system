# Promote an approved, versioned artifact to the isolated STAGING target
# (Laboratory 8).  This is continuous DELIVERY: the workflow stops at the
# "staging" environment approval gate until the approver approves.
#
# Staging target: the team PC running Docker Desktop (Compose project
# "lrs-staging", http://127.0.0.1:8081). Windows Smart App Control on that PC
# blocks the GitHub self-hosted runner, so the lab's "manual promotion with
# recorded approval" is used: the gated job below runs on a GitHub-hosted
# runner, records the approval, and only then prints the exact digest-pinned
# command that the operator runs on the staging PC (scripts/promote-local.sh).
#
# One-time repository setup (Settings -> Environments -> "staging"):
#   - Required reviewers: the designated approver
#   - Variables: STAGING_URL (http://127.0.0.1:8081)
#
# Rollback: run this workflow again with the known-good version.
name: Deploy to staging

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to promote (must exist in GHCR, e.g. 1.0.0)"
        required: true
      run_migrations:
        description: "Approved schema change: run migrations (takes a recovery point first)"
        type: boolean
        default: false
      mark_known_good:
        description: "Record this release as the known-good rollback target after it passes"
        type: boolean
        default: false
      verify_request_id:
        description: "Optional: STAGE-LIB-08 request ID that must still exist (post-rollback check)"
        required: false
      reason:
        description: "Change / rollback reason (goes into the deployment log)"
        required: true

permissions:
  contents: read
  packages: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  prepare:
    name: Identify artifact for approval
    runs-on: ubuntu-24.04
    outputs:
      app_ref: ${{ steps.resolve.outputs.app_ref }}
      web_ref: ${{ steps.resolve.outputs.web_ref }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable digests
        id: resolve
        run: |
          REPO="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          V="${{ inputs.version }}"
          APP_DIGEST="$(docker buildx imagetools inspect "ghcr.io/$REPO-app:$V" --format '{{json .Manifest}}' | jq -r .digest)"
          WEB_DIGEST="$(docker buildx imagetools inspect "ghcr.io/$REPO-web:$V" --format '{{json .Manifest}}' | jq -r .digest)"
          docker pull -q "ghcr.io/$REPO-app@$APP_DIGEST" >/dev/null
          REVISION="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/$REPO-app@$APP_DIGEST")"
          echo "app_ref=ghcr.io/$REPO-app@$APP_DIGEST" >> "$GITHUB_OUTPUT"
          echo "web_ref=ghcr.io/$REPO-web@$WEB_DIGEST" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          {
            echo "## Approval request: staging promotion of ${V}"
            echo ""
            echo "Approver: verify the CI result, artifact identifier, target and migration plan before approving."
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Version | \`$V\` |"
            echo "| Commit (image label) | \`$REVISION\` |"
            echo "| CI for commit | ${{ github.server_url }}/${{ github.repository }}/commit/$REVISION/checks |"
            echo "| App artifact | \`ghcr.io/$REPO-app@$APP_DIGEST\` |"
            echo "| Web artifact | \`ghcr.io/$REPO-web@$WEB_DIGEST\` |"
            echo "| Target | staging (http://127.0.0.1:8081, team PC) |"
            echo "| Migration requested | ${{ inputs.run_migrations }} |"
            echo "| Reason | ${{ inputs.reason }} |"
            echo "| Requested by | ${{ github.actor }} at $(date -u +%Y-%m-%dT%H:%M:%SZ) |"
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approval gate - promotion record
    needs: prepare
    runs-on: ubuntu-24.04
    # ---- APPROVAL GATE: job waits here for the staging required reviewer ----
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Write promotion record and the approved command
        env:
          VERSION: ${{ inputs.version }}
          APP_REF: ${{ needs.prepare.outputs.app_ref }}
          WEB_REF: ${{ needs.prepare.outputs.web_ref }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          MIGRATE: ${{ inputs.run_migrations }}
          KNOWN_GOOD: ${{ inputs.mark_known_good }}
          VERIFY_ID: ${{ inputs.verify_request_id }}
          REASON: ${{ inputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          APPROVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CMD="sh scripts/promote-local.sh --version $VERSION --app-ref $APP_REF --web-ref $WEB_REF --run-url $RUN_URL"
          [ "$MIGRATE" = "true" ] && CMD="$CMD --migrate"
          [ "$KNOWN_GOOD" = "true" ] && CMD="$CMD --known-good"
          [ -n "$VERIFY_ID" ] && CMD="$CMD --verify-request-id $VERIFY_ID"
          cat > promotion-record.json <<JSON
          {
            "version": "$VERSION",
            "revision": "$REVISION",
            "app_image": "$APP_REF",
            "web_image": "$WEB_REF",
            "target": "staging (${{ vars.STAGING_URL }})",
            "run_migrations": $MIGRATE,
            "mark_known_good": $KNOWN_GOOD,
            "reason": "$REASON",
            "approved_run": "$RUN_URL",
            "gate_passed_at": "$APPROVED_AT"
          }
          JSON
          {
            echo "## Approved: promote ${VERSION} to staging"
            echo ""
            echo "Gate passed at \`$APPROVED_AT\`. On the staging PC, in Git Bash, from the repository root run:"
            echo ""
            echo '```sh'
            echo "$CMD"
            echo '```'
            echo ""
            echo "It deploys exactly \`$APP_REF\`, checks \`/health\` (version + revision \`$REVISION\`) and runs smoke tests S1-S5${VERIFY_ID:+ and S6 for request #$VERIFY_ID}."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: promotion-record-${{ inputs.version }}-${{ github.run_id }}
          path: promotion-record.json
