# Lab 10 - readiness checker configuration (no secrets)
# Read by scripts/health-check.sh as KEY=VALUE text.

SERVICE_NAME=laravel-request-system (local)
READY_URL=http://localhost:8000/health/ready

# Sampling: 20 checks, one every 5 seconds, each with a 5-second timeout
CHECKS=20
INTERVAL_SECONDS=5
TIMEOUT_SECONDS=5

# SLI / SLO
# SLI 1 (availability): % of readiness checks that return HTTP 200
# SLI 2 (latency): % of successful checks that respond in 500 ms or less
SLO_SUCCESS_PERCENT=95
SLO_LATENCY_MS=500
SLO_LATENCY_PERCENT=95

# Notification: alert once after 2 consecutive failures; no repeats until the service recovers
ALERT_AFTER_CONSECUTIVE_FAILURES=2
RESPONDER=Cyrene Jane C. Teodocio
