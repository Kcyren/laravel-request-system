# =====================================================================
# Laravel Request System - Docker Compose (Laboratory 4)
# =====================================================================
#   browser -> web (Nginx, 127.0.0.1:8080) -> app (PHP-FPM :9000) -> db (MySQL :3306)
#
# Runtime secrets live in .env.container (app) and .env.db (db), both
# created from the *.example templates and excluded from Git and images.
#
#   docker compose config --quiet
#   docker compose up -d --build
#   docker compose ps
#   docker compose exec app php artisan migrate
#
# Never run `docker compose down -v` - it deletes the db_data volume.
# =====================================================================
name: ${COMPOSE_PROJECT_NAME:-laravel-request-system}

services:
  app:
    build:
      context: .
      target: app
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
        LAB_FAULT: ${LAB_FAULT:-false}
    image: ${APP_IMAGE_REF:-laravel-request-system-app:local}
    env_file:
      - .env.container
    depends_on:
      db:
        condition: service_healthy   # waits for MySQL readiness, not just "started"
    healthcheck:
      test: ["CMD", "app-healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        APP_VERSION: ${APP_VERSION:-}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: ${WEB_IMAGE_REF:-laravel-request-system-web:local}
    ports:
      # Bound to localhost only; change WEB_PORT for a second copy (reproduction test)
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: mysql:8.4
    env_file:
      - .env.db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    # No "ports:" - MySQL is reachable only on the private backend network.
    healthcheck:
      # TCP ping succeeds only after initialisation finishes (not just container start)
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true   # no outbound/inbound route outside Docker for app and db

volumes:
  db_data:
