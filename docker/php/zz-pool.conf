; PHP-FPM pool overrides (loaded after www.conf)
[www]
listen = 9000
; Pass the container's runtime environment (from env_file) to PHP workers
clear_env = no
; Lightweight liveness endpoint used by the container health check
ping.path = /fpm-ping
ping.response = pong
; Hide the PHP version
php_admin_flag[expose_php] = off
